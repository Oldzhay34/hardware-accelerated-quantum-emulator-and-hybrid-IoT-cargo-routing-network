# Faz 0.2 taslağı — tam denetim Faz 0.3'te (docs/secrets-audit.md).
# Uzak depo (GitHub) bağlanana kadar bu iş akışı çalışmaz; dosya baştan hazır tutulur.
name: secrets-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
