# Her push ve PR'da gitleaks ile sır taraması. Denetim: docs/secrets-audit.md
#
# DURUM (2026-09-20 doğrulandı): çalışıyor — 19 koşu, hepsi başarılı.
# secrets.enc.yaml bilerek commit edilir (SOPS+age şifreli) ve gitleaks onu
# işaretlemiyor; bu yüzden .gitleaksignore YOK ve olmamalı — gereksiz bir
# ignore dosyası taramayı zayıflatır.
#
# ⚠️ gitleaks-action@v2, ORGANIZASYON depolarında GITLEAKS_LICENSE ister.
# Bu depo kişisel (Oldzhay34/...) olduğu için ücretsiz. Depo bir üniversite
# organizasyonuna taşınırsa bu iş akışı lisans hatasıyla düşer.
name: secrets-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
